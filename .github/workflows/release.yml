# Cut a release: bump "version" in package.json, commit, then
#   git tag v0.3.0 && git push origin v0.3.0
# Each platform builds without publishing (the Windows helper cannot be cross-built).
# Only after all builds succeed does the final job validate every installer and
# update manifest, upload to a draft, and publish the complete release. A failed
# build creates no release; a failed upload leaves a draft for a safe retry.
# A dispatch builds the selected branch; its version must match the requested tag.
# Published releases are never overwritten; repairing one is a separate operation.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag matching the branch's package version; must be unpublished"
        required: true
permissions:
  contents: read
# Serialize retries for a tag, including tag pushes and manual dispatches.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            # The .zip, latest-mac.yml and block maps are what the app's updater reads.
            assets: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
              release/*.blockmap
          - os: windows-latest
            target: win
            assets: |
              release/*.exe
              release/latest.yml
              release/*.blockmap
          - os: ubuntu-latest
            target: linux
            assets: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      # From scripts/mac-signing-cert.sh. Without them macOS builds stay ad hoc signed.
      HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
    steps:
      # A dispatch builds the branch it was started from, not the tag's commit.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # One certificate for every release, so macOS keeps Screen Recording and Accessibility
      # across updates. electron-builder only uses a certificate macOS trusts for code
      # signing, so the self-signed one is trusted on the runner first.
      - name: Load the macOS signing certificate
        if: matrix.target == 'mac' && env.MAC_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-certificate -c "Lawdie Time Capture Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KC" | grep "Lawdie Time Capture Signing"
          echo "MAC_IDENTITY=Lawdie Time Capture Signing" >> "$GITHUB_ENV"
      - run: npm run package:${{ matrix.target }} ${MAC_IDENTITY:+-- "-c.mac.identity=$MAC_IDENTITY"}
        shell: bash
      - name: Check the macOS signature
        if: matrix.target == 'mac' && env.MAC_IDENTITY != ''
        run: codesign -d -r- "release/mac-arm64/Lawdie Time Capture.app" 2>&1 | grep "certificate"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.assets }}
          if-no-files-found: error
          compression-level: 0
  publish:
    # The default success condition requires every matrix child to finish successfully.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Validate artifacts, upload a draft, then publish
        uses: actions/github-script@v7
        with:
          script: |
            const { readFile } = await import('node:fs/promises');
            const { pathToFileURL } = await import('node:url');
            const { publishRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/release.mjs`).href);
            const { version } = JSON.parse(await readFile('package.json', 'utf8'));
            await publishRelease({ github, repo: context.repo, directory: 'release', tag: process.env.RELEASE_TAG, version });
