# Installers for every platform from one build. No Developer ID / Authenticode signing
# is configured: macOS users click "Open Anyway" once, Windows users click "More info →
# Run anyway" once. Add certificates here when there is a paying customer to justify them.
appId: co.lawdie.timecapture.desktop
productName: Lawdie Time Capture
copyright: Copyright © 2026 Lawdie. All rights reserved.
directories:
  output: release
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
asarUnpack:
  # get-windows ships native helper binaries that must live on disk.
  - node_modules/get-windows/**
  # The macOS screen-text reader (native/screen-text) is run as a program.
  - resources/bin/**
# Version-free artifact names, so <release>/latest/download/<name> is a stable link a
# website button can point at. The version is on the release itself.
mac:
  artifactName: "Lawdie-Time-Capture-mac-${arch}.${ext}"
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  # "-" signs ad hoc: no certificate, but a valid signature under the app's own id.
  # Without one the bundle keeps Electron's stock signature, which packaging breaks, and
  # macOS then cannot attach a permission to it (Accessibility for on-screen text never
  # took effect). An ad hoc signature changes with every build, so a permission granted
  # to one build must be granted again after an update; a Developer ID ends that.
  identity: "-"
  extendInfo:
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
    LSUIElement: false
win:
  artifactName: "Lawdie-Time-Capture-windows-setup.${ext}"
  # x64 only: get-windows' native helper cannot be cross-compiled for win-arm64 from
  # macOS, and Windows on ARM runs x64 builds under emulation.
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Lawdie Time Capture
linux:
  artifactName: "Lawdie-Time-Capture-linux.${ext}"
  target: [AppImage]
  icon: build/icon.png
  category: Office
